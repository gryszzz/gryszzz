name: Refresh profile graphics

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/profile-graphics.yml"
  schedule:
    - cron: "17 7 * * *"

permissions:
  contents: write

concurrency:
  group: profile-graphics
  cancel-in-progress: false

jobs:
  graphics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: GitHub activity card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=gryszzz&show_icons=true&custom_title=GitHub%20Statistics&bg_color=11111E&title_color=EA5698&text_color=B2F4EA&icon_color=EA5698&border_color=777886&border_radius=11
          path: assets/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Language card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=gryszzz&layout=normal&langs_count=5&custom_title=Most%20Used%20Languages&bg_color=11111E&title_color=EA5698&text_color=B2F4EA&border_color=777886&border_radius=11
          path: assets/languages.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Contribution streak card
        uses: zients/github-readme-streak-stats@v2
        with:
          options: user=gryszzz&background=11111E&border=777886&stroke=777886&ring=EA5698&fire=F4B340&currStreakNum=B2F4EA&sideNums=B2F4EA&currStreakLabel=EA5698&sideLabels=B2F4EA&dates=92A9B2&card_width=760&card_height=262&disable_animations=true
          path: assets/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit stable SVG images to this repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/languages.svg assets/streak.svg
          if git diff --cached --quiet; then
            echo "Graphics unchanged"
            exit 0
          fi
          git commit -m "chore(profile): refresh saved GitHub graphics"
          git push
